<!--
  This app needs no build step (no npm install). React, ReactDOM and Babel
  are loaded from cdnjs at runtime (requires an internet connection on this
  machine). The app code below is inlined directly in this file (rather than
  loaded from a separate app.jsx via <script src>) because browsers block
  Babel's background fetch of external scripts when this file is opened
  directly as file:// - inlining avoids that entirely, so double-clicking
  this file just works.

  API_BASE: opened as a local file (file://) it talks to a backend on
  http://localhost:8000. When this page is instead served over http(s) by
  the backend itself (e.g. your Render URL, or http://localhost:8000/), it
  automatically talks to that same address. If you host this page on a
  DIFFERENT site than the backend (e.g. Vercel), replace the expression
  below with your backend URL in quotes.
-->
<script>window.API_BASE = location.protocol === "file:" ? "http://localhost:8000" : location.origin;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API_BASE = window.API_BASE || "http://localhost:8000";

async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

// ---------------------------------------------------------------------------
// Recent-papers tracking (device-local, via localStorage). Every paper the
// backend generates is already persisted server-side (see db.py) and
// reachable via GET /api/papers/{id} - but there was previously no way to
// find that id again after leaving the page (e.g. clicking "Change
// chapters"), so generated papers effectively felt "lost" even though they
// still existed. This keeps a lightweight pointer list (id/title/marks/etc,
// not the full paper) so "My Papers" can list and reopen them later.
const RECENT_PAPERS_KEY = "cbse_recent_papers";
const RECENT_PAPERS_LIMIT = 40;

function getRecentPapers() {
  try {
    const raw = localStorage.getItem(RECENT_PAPERS_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) {
    return [];
  }
}

function addRecentPapers(papers, course) {
  const existing = getRecentPapers();
  const existingIds = new Set(existing.map((p) => p.id));
  const additions = papers
    .filter((p) => !existingIds.has(p.id))
    .map((p) => ({
      id: p.id,
      title: p.title,
      set_label: p.set_label,
      pattern: p.pattern,
      total_marks: p.total_marks,
      course: course,
      generated_at: new Date().toISOString(),
    }));
  const merged = [...additions, ...existing].slice(0, RECENT_PAPERS_LIMIT);
  localStorage.setItem(RECENT_PAPERS_KEY, JSON.stringify(merged));
}

function removeRecentPaper(id) {
  const remaining = getRecentPapers().filter((p) => p.id !== id);
  localStorage.setItem(RECENT_PAPERS_KEY, JSON.stringify(remaining));
  return remaining;
}

function clearRecentPapers() {
  localStorage.removeItem(RECENT_PAPERS_KEY);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    case "5M": return "pill m5";
    case "CBQ": return "pill cbq";
    case "MAP": return "pill map";
    case "READING": return "pill cbq";
    case "EXTRACT": return "pill cbq";
    case "CLOZE": return "pill ar";
    case "EDITING": return "pill ar";
    case "REPORTED": return "pill ar";
    case "JUMBLED": return "pill ar";
    case "APPLICATION": return "pill m3";

function isChoiceType(type) {
  return type === "MCQ" || type === "AR";
}
const SUBJECT_ORDER = ["History", "Geography", "Political Science", "Economics"];

// Groups a flat question/result list into consecutive runs, tagging each
// entry with whether it starts a new subject section and/or a new
// passage group (CBQ/MAP), so the UI can render section headers and shared
// passages exactly once. Section headers are only meaningful for the
// "school" pattern, where questions are laid out in contiguous per-subject
// blocks - for the flat mixed "board" pattern (questions pooled and
// shuffled across subjects within each mark-type), showSections should be
// false so we don't render a confusing header every time the subject
// happens to change between two consecutive questions.
function annotateGrouping(items, showSections) {
  let lastLabel = null;
  let lastGroup = null;
  return items.map((item) => {
    const subjectLabel = item.subject
      ? item.subject.charAt(0).toUpperCase() + item.subject.slice(1).replace("civics", "Political Science")
      : null;
    const niceSubject = item.subject === "civics" ? "Political Science" : subjectLabel;
    // English papers carry an explicit `section` (Reading / Writing & Grammar
    // / Literature) since those don't map onto a single "subject" the way
    // Social Science/Science do - prefer it over the subject-derived label.
    const label = item.section || niceSubject;
    const startsSection = showSections && label && label !== lastLabel;
    const startsGroup = !item.group_id || item.group_id !== lastGroup;
    lastLabel = label || lastLabel;
    lastGroup = item.group_id || null;
    return { ...item, _sectionLabel: label, _startsSection: startsSection, _startsGroup: startsGroup };
  });
}

function TopicVideo({ videoId, title }) {
  const [loaded, setLoaded] = useState(false);
  if (!videoId) return null;
  const watchUrl = "https://www.youtube.com/watch?v=" + videoId;
  const isFileProtocol = typeof window !== "undefined" && window.location && window.location.protocol === "file:";
  return (
    <div className="topic-video" style={{ marginTop: 8, marginBottom: 4 }}>
      {loaded ? (
        <div>
          {isFileProtocol ? (
            // The YouTube player can't initialise on a page opened directly from disk
            // (file://) - it rejects the "null" origin and shows "Error 153". Rather
            // than show a broken embed, skip straight to a normal link that opens the
            // video in the browser, which always works regardless of how the app is served.
            <a className="btn-video-load" href={watchUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, textDecoration: "none" }}>
              &#9654; Open on YouTube: {title || "Concept video"}
            </a>
          ) : (
            <>
              <div className="video-embed-wrap" style={{ position: "relative", paddingBottom: "56.25%", height: 0, overflow: "hidden", borderRadius: 8, maxWidth: 480 }}>
                <iframe
                  src={"https://www.youtube.com/embed/" + videoId}
                  title={title || "Concept video"}
                  frameBorder="0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  allowFullScreen
                  style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%" }}
                />
              </div>
              <div style={{ marginTop: 4 }}>
                <a href={watchUrl} target="_blank" rel="noopener noreferrer" style={{ fontSize: 11.5 }}>
                  Video not playing? Open it directly on YouTube &#8599;
                </a>
              </div>
            </>
          )}
        </div>
      ) : (
        <button className="btn-video-load" onClick={() => setLoaded(true)} style={{ fontSize: 13 }}>
          &#9654; Watch: {title || "Concept video"}
        </button>
      )}
    </div>
  );
}

function NotesView({ course, initialChapterId, onInitialChapterConsumed }) {
  const [subjects, setSubjects] = useState([]);
  const [chapterId, setChapterId] = useState("");
  const [notes, setNotes] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    apiGet("/api/subjects").then((d) => setSubjects(d.subjects)).catch((e) => setError(e.message));
  }, []);

  const visibleSubjects = subjects.filter((s) => s.group === course);

  useEffect(() => {
    // Reset the selected chapter/notes when the course changes, so notes
    // from the previously selected course don't linger on screen - unless
    // this course switch was triggered by "Open full chapter" from Ask a
    // Topic, in which case initialChapterId (below) will load the right
    // chapter for the new course right after.
    if (!initialChapterId) {
      setChapterId("");
      setNotes(null);
    }
  }, [course]);

  const loadNotes = (id) => {
    if (!id) return;
    setLoading(true);
    setError("");
    apiGet("/api/notes?chapter=" + encodeURIComponent(id))
      .then((d) => setNotes(d))
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  };

  // Jumped here from "Ask a Topic" -> Open full chapter: load that specific
  // chapter once, then tell the parent to clear the request so navigating
  // away and back to Notes normally doesn't keep re-loading it.
  useEffect(() => {
    if (initialChapterId) {
      setChapterId(initialChapterId);
      loadNotes(initialChapterId);
      if (onInitialChapterConsumed) onInitialChapterConsumed();
    }
  }, [initialChapterId]);

  return (
    <div>
      <div className="card">
        <h2>Pick a chapter</h2>
        {error && <div className="error-box">{error}</div>}
        <label className="field-label">Chapter</label>
        <select
          value={chapterId}
          onChange={(e) => {
            setChapterId(e.target.value);
            loadNotes(e.target.value);
          }}
        >
          <option value="">-- Select a chapter --</option>
          {visibleSubjects.map((s) => (
            <optgroup key={s.subject} label={s.label}>
              {s.chapters.map((c) => (
                <option key={c.id} value={c.id}>{c.title}</option>
              ))}
            </optgroup>
          ))}
        </select>
      </div>

      {loading && <div className="muted">Loading notes...</div>}

      {notes && (
        <div className="card">
          <h2>{notes.title}</h2>
          <div className="notes-section">
            <h3>Overview</h3>
            <p style={{ fontSize: 14, lineHeight: 1.6 }}>{notes.notes.overview}</p>
          </div>

          {notes.notes.sections && notes.notes.sections.length > 0 ? (
            <div className="notes-section">
              {notes.notes.sections.map((sec, i) => (
                <div className="board-note-block" key={i}>
                  <h3>{sec.title}</h3>
                  <p style={{ fontSize: 14, lineHeight: 1.65 }}>{sec.content}</p>
                  {sec.keywords && sec.keywords.length > 0 && (
                    <div className="tag-list" style={{ marginTop: 4, marginBottom: 4 }}>
                      <span className="muted" style={{ fontSize: 11.5, marginRight: 4 }}>Board keywords:</span>
                      {sec.keywords.map((k, ki) => <span key={ki} className="keyword-chip">{k}</span>)}
                    </div>
                  )}
                  {sec.video_id && <TopicVideo videoId={sec.video_id} title={sec.video_title} />}
                </div>
              ))}
            </div>
          ) : (
            <div className="notes-section">
              <h3>Key Points</h3>
              <ul>{notes.notes.key_points.map((p, i) => <li key={i}>{p}</li>)}</ul>
            </div>
          )}

          <div className="notes-section">
            <h3>Key Terms</h3>
            {Object.entries(notes.notes.key_terms).map(([term, def]) => (
              <div className="term-item" key={term}><b>{term}:</b> {def}</div>
            ))}
          </div>
          <div className="notes-section">
            <h3>Important Facts</h3>
            <ul>{notes.notes.important_facts.map((p, i) => <li key={i}>{p}</li>)}</ul>
          </div>
          <div className="notes-section">
            <h3>Exam Tips</h3>
            <ul>{notes.notes.exam_tips.map((p, i) => <li key={i}>{p}</li>)}</ul>
          </div>
          {notes.notes.case_study_video && (
            <div className="notes-section">
              <h3>Solving Case-Based / Scenario Questions</h3>
              <p style={{ fontSize: 13.5, lineHeight: 1.6 }} className="muted">{notes.notes.case_study_video.description}</p>
              <TopicVideo videoId={notes.notes.case_study_video.video_id} title={notes.notes.case_study_video.video_title} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// "Ask a Topic" - a free-text prompt box for a student who just wants to
// understand one specific topic, without knowing (or caring) which chapter
// it's filed under. Backed by content_store.search_topics: a deterministic
// keyword/fuzzy search over every chapter section already in the app (no
// external AI calls), so the video shown is always one already verified
// when the content library was built - never a live/unverified lookup.
const TOPIC_EXAMPLES = [
  "reflection of light",
  "photosynthesis",
  "ohm's law",
  "causes of the first world war",
  "types of soil in India",
];

function relevanceLabel(score) {
  if (score >= 80) return { text: "Strong match", cls: "good" };
  if (score >= 30) return { text: "Possible match", cls: "mid" };
  return { text: "Weak match", cls: "bad" };
}

function AskTopicView({ onOpenChapter }) {
  const [query, setQuery] = useState("");
  const [results, setResults] = useState(null);
  const [searched, setSearched] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [openIdx, setOpenIdx] = useState(0);

  const runSearch = (q) => {
    const trimmed = (q !== undefined ? q : query).trim();
    if (!trimmed) {
      setError("Type a topic or question first.");
      return;
    }
    setQuery(trimmed);
    setLoading(true);
    setError("");
    setSearched(true);
    apiGet("/api/topic-search?q=" + encodeURIComponent(trimmed))
      .then((d) => {
        setResults(d.results);
        setOpenIdx(0);
      })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  };

  return (
    <div>
      <div className="card">
        <h2>Ask about one topic</h2>
        <p className="muted">
          Type a topic name or a whole question - e.g. "reflection of light" or "why does a convex
          mirror always give a smaller image?" - and get the relevant Chapter Notes section plus its
          concept video, without hunting through chapters.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input
            type="text"
            placeholder="Type a topic or question..."
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") runSearch(); }}
            style={{ flex: "1 1 320px" }}
          />
          <button className="btn orange" disabled={loading} onClick={() => runSearch()}>
            {loading ? "Searching..." : "Search"}
          </button>
        </div>
        <div className="tag-list" style={{ marginTop: 10 }}>
          <span className="muted" style={{ fontSize: 12, marginRight: 4 }}>Try:</span>
          {TOPIC_EXAMPLES.map((ex) => (
            <span
              key={ex}
              className="keyword-chip"
              style={{ cursor: "pointer" }}
              onClick={() => { setQuery(ex); runSearch(ex); }}
            >
              {ex}
            </span>
          ))}
        </div>
        {error && <div className="error-box" style={{ marginTop: 10 }}>{error}</div>}
      </div>

      {searched && !loading && results && results.length === 0 && (
        <div className="card">
          <div className="warn-box">
            No close match found in the notes yet. Try simpler or different keywords, or browse the
            chapter directly from Chapter Notes.
          </div>
        </div>
      )}

      {results && results.length > 0 && (
        <div className="card">
          <h2>{results.length === 1 ? "Here's what I found" : `${results.length} possible matches`}</h2>
          {results.length > 1 && (
            <p className="muted" style={{ marginTop: -4 }}>
              Not the one you meant? Pick a different match below.
            </p>
          )}
          <div className="tag-list" style={{ marginBottom: 14 }}>
            {results.map((r, i) => {
              const rel = relevanceLabel(r.relevance);
              return (
                <span
                  key={i}
                  className={"tag " + (i === openIdx ? "good" : "mid")}
                  style={{ cursor: "pointer" }}
                  onClick={() => setOpenIdx(i)}
                >
                  {r.section_title}
                </span>
              );
            })}
          </div>

          {results[openIdx] && (() => {
            const r = results[openIdx];
            const rel = relevanceLabel(r.relevance);
            return (
              <div className="board-note-block">
                <div className="tag-list" style={{ marginBottom: 6 }}>
                  <span className="keyword-chip">{r.subject_label}</span>
                  <span className="keyword-chip">{r.chapter_title}</span>
                  <span className={"tag " + rel.cls} style={{ fontSize: 11 }}>{rel.text}</span>
                </div>
                <h3>{r.section_title}</h3>
                <p style={{ fontSize: 14, lineHeight: 1.65 }}>{r.content}</p>
                {r.keywords && r.keywords.length > 0 && (
                  <div className="tag-list" style={{ marginTop: 4, marginBottom: 4 }}>
                    <span className="muted" style={{ fontSize: 11.5, marginRight: 4 }}>Board keywords:</span>
                    {r.keywords.map((k, ki) => <span key={ki} className="keyword-chip">{k}</span>)}
                  </div>
                )}
                {r.video_id ? (
                  <TopicVideo videoId={r.video_id} title={r.video_title} />
                ) : (
                  <p className="muted" style={{ fontSize: 12.5, marginTop: 6 }}>No concept video linked for this topic yet.</p>
                )}
                {rel.cls === "bad" && (
                  <div className="warn-box" style={{ marginTop: 10 }}>
                    This looks like a weak match - the notes may not cover this exact topic. Try rephrasing,
                    or open the full chapter from Chapter Notes to browse.
                  </div>
                )}
                {onOpenChapter && (
                  <button className="btn secondary" style={{ marginTop: 10 }} onClick={() => onOpenChapter(r.chapter_id, r.subject_group)}>
                    Open full chapter in Chapter Notes
                  </button>
                )}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Free-form "Ask AI" tutor - Groq-backed, grounded (RAG) in this app's own
// curated content bank via the same /api/topic-search index AskTopicView
// uses. Unlike AskTopicView (which only ever returns notes already written
// into this app, verbatim), this can answer ANY question a student types -
// including ones from outside this app's chapter bank - by sending it to
// Groq along with whatever relevant context retrieval finds. Checks
// /api/ai-status on mount and shows setup instructions instead of a
// question box that would just fail, same lesson learned from the OCR
// upload box in AttemptPaperView.
function AskAIView() {
  const [aiStatus, setAiStatus] = useState(null); // null = checking; {available, reason, model} once known
  const [question, setQuestion] = useState("");
  const [asking, setAsking] = useState(false);
  const [error, setError] = useState("");
  const [history, setHistory] = useState([]); // [{question, answer, sources}], most recent first

  useEffect(() => {
    apiGet("/api/ai-status")
      .then(setAiStatus)
      .catch(() => setAiStatus({ available: false, reason: "Couldn't reach the server to check AI status." }));
  }, []);

  const ask = () => {
    const trimmed = question.trim();
    if (!trimmed) {
      setError("Type a question first.");
      return;
    }
    setAsking(true);
    setError("");
    apiPost("/api/ask-ai", { question: trimmed })
      .then((result) => {
        if (result.error) {
          setError(result.error);
          return;
        }
        setHistory((prev) => [{ question: trimmed, answer: result.answer, sources: result.sources || [] }, ...prev]);
        setQuestion("");
      })
      .catch((e) => setError(e.message))
      .finally(() => setAsking(false));
  };

  if (aiStatus === null) {
    return <div className="card">Checking AI tutor availability...</div>;
  }

  if (!aiStatus.available) {
    return (
      <div className="card">
        <h2>Ask AI</h2>
        <div className="warn-box" style={{ background: "var(--bg)" }}>
          <b>The AI tutor isn't set up on this server yet</b>
          <div className="muted" style={{ marginTop: 4, fontSize: 13 }}>
            This feature answers any question in real time using Groq, grounded in this app's own
            CBSE Class 10 notes - but it needs a Groq API key on the computer running this server.
            ({aiStatus.reason})
          </div>
          <div className="muted" style={{ marginTop: 8, fontSize: 13 }}>
            To turn it on: get a free key at{" "}
            <a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">console.groq.com/keys</a>,
            then set it as an environment variable before starting the server, e.g. (Mac/Linux):
          </div>
          <code style={{ display: "block", margin: "6px 0", padding: "6px 8px", background: "var(--card)", borderRadius: 4 }}>
            export GROQ_API_KEY=your-key-here{"\n"}python3 server.py
          </code>
          <div className="muted" style={{ fontSize: 13 }}>
            Everything else in this app (notes, papers, grading, Ask a Topic) works fully offline and
            doesn't need this - it's only the free-form AI tutor that needs it.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="card">
        <h2>Ask AI</h2>
        <p className="muted">
          Ask literally anything - paste in a homework question from outside this app, ask "why" about
          something in the notes, or ask for the same explanation a different way. Answered in real time
          by Groq ({aiStatus.model}), grounded in this app's own CBSE Class 10 notes where relevant.
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <textarea
            placeholder="Type your question..."
            value={question}
            onChange={(e) => setQuestion(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); }}
            style={{ flex: "1 1 320px", minHeight: 70 }}
          />
        </div>
        <button className="btn orange" style={{ marginTop: 8 }} disabled={asking} onClick={ask}>
          {asking ? "Thinking..." : "Ask"}
        </button>
        <span className="muted" style={{ fontSize: 12, marginLeft: 8 }}>or Cmd/Ctrl+Enter</span>
        {error && <div className="error-box" style={{ marginTop: 10 }}>{error}</div>}
      </div>

      {history.map((h, i) => (
        <div className="card" key={i}>
          <div style={{ fontWeight: 700, marginBottom: 6 }}>{h.question}</div>
          <p style={{ fontSize: 14, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{h.answer}</p>
          {h.sources && h.sources.length > 0 && (
            <div className="tag-list" style={{ marginTop: 8 }}>
              <span className="muted" style={{ fontSize: 11.5, marginRight: 4 }}>Grounded in:</span>
              {h.sources.map((s, si) => (
                <span key={si} className="keyword-chip" title={s.section_title}>{s.chapter_title}</span>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

const CUSTOM_TYPE_INFO = [
  { key: "MCQ", label: "MCQ", marksEach: 1 },
  { key: "AR", label: "Assertion-Reason", marksEach: 1 },
  { key: "2M", label: "2-mark", marksEach: 2 },
  { key: "3M", label: "3-mark", marksEach: 3 },
  { key: "5M", label: "5-mark", marksEach: 5 },
];
const EMPTY_CUSTOM_COUNTS = { MCQ: 0, AR: 0, "2M": 0, "3M": 0, "5M": 0 };

function GeneratePaperView({ onSetsReady, course }) {
  const [subjects, setSubjects] = useState([]);
  const [selected, setSelected] = useState([]);
  const [totalMarks, setTotalMarks] = useState(30);
  const [paperMode, setPaperMode] = useState("fixed"); // "fixed" | "custom" (english always uses its own fixed pattern)
  const [customCounts, setCustomCounts] = useState(EMPTY_CUSTOM_COUNTS);
  const [numSets, setNumSets] = useState(1);
  const [englishSet, setEnglishSet] = useState("");
  const [englishSets, setEnglishSets] = useState([]);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    apiGet("/api/english-sets").then((d) => setEnglishSets(d.sets || [])).catch(() => {});
  }, []);

  useEffect(() => {
    apiGet("/api/subjects").then((d) => setSubjects(d.subjects)).catch((e) => setError(e.message));
  }, []);

  const visibleSubjects = subjects.filter((s) => s.group === course);

  useEffect(() => {
    // Switching course invalidates any chapters selected from the other
    // course, so clear the selection to avoid mixing Science and Social
    // Science chapters into one paper.
    setSelected([]);
  }, [course]);

  const toggle = (id) => {
    setSelected((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const setCustomCount = (typeKey, value) => {
    const n = Math.max(0, Math.min(50, Number(value) || 0));
    setCustomCounts((prev) => ({ ...prev, [typeKey]: n }));
  };

  const customTotalMarks = CUSTOM_TYPE_INFO.reduce(
    (sum, t) => sum + (Number(customCounts[t.key]) || 0) * t.marksEach, 0
  );
  const customTotalQuestions = CUSTOM_TYPE_INFO.reduce((sum, t) => sum + (Number(customCounts[t.key]) || 0), 0);

  const isCustom = course !== "english" && paperMode === "custom";

  const generate = () => {
    if (selected.length === 0 && course !== "english") {
      setError("Select at least one chapter.");
      return;
    }
    if (isCustom && customTotalQuestions === 0) {
      setError("Enter a count greater than 0 for at least one question type.");
      return;
    }
    setLoading(true);
    setError("");
    const payload =
      course === "english"
        ? { chapters: selected, pattern: "english", num_sets: Number(numSets) || 1, english_set: englishSet || undefined }
        : isCustom
        ? { chapters: selected, pattern: "custom", custom_counts: customCounts, num_sets: Number(numSets) || 1 }
        : { chapters: selected, pattern: "board", total_marks: totalMarks, num_sets: Number(numSets) || 1 };
    apiPost("/api/papers/generate", payload)
      .then((d) => onSetsReady(d.papers))
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  };

  return (
    <div className="card">
      <h2>Generate a practice question paper</h2>
      <p className="muted">
        {course === "english"
          ? "English papers always follow the real CBSE (Communicative) board pattern: Reading Skills (22), Writing Skills (22), Grammar (10), Literature (26) - 80 marks total, 3-hour paper."
          : "Papers are made up of MCQs (1 mark each), Assertion-Reason (1 mark each), 2-mark, 3-mark and 5-mark questions."}
        {course === "social_science" && !isCustom
          ? " The 80-mark paper also includes one map-based question, since several chapters involve map work."
          : ""}
      </p>
      {visibleSubjects.length === 0 && (
        <div className="warn-box">No chapters are available yet for this course.</div>
      )}
      {error && <div className="error-box">{error}</div>}

      <div className="grid-2">
        <div>
          <label className="field-label">{course === "english" ? "Literature chapters" : "Chapters"}</label>
          {course === "english" && (
            <p className="muted" style={{ marginTop: -4, marginBottom: 8, fontSize: 12.5 }}>
              Pick which Fiction/Poetry/Drama chapters Section D draws from. Reading, Writing and
              Grammar sections are included automatically in every English paper.
            </p>
          )}
          <div className="chapter-checklist">
            {visibleSubjects.map((s) => (
              <div className="subject-group" key={s.subject}>
                <div className="subject-title">{s.label}</div>
                {course === "english" && s.chapters.some((c) => c.id === "grammar_writing") && (
                  <label style={{ opacity: 0.7, cursor: "default" }} title="Reading, Writing and Grammar sections are always included in every English paper - no selection needed.">
                    <input type="checkbox" checked disabled />
                    Grammar &amp; Writing Skills <span className="muted">(always included)</span>
                  </label>
                )}
                {s.chapters.filter((c) => c.id !== "grammar_writing").map((c) => (
                  <label key={c.id}>
                    <input type="checkbox" checked={selected.includes(c.id)} onChange={() => toggle(c.id)} />
                    {c.title}
                  </label>
                ))}
              </div>
            ))}
          </div>
        </div>
        <div>
          {course === "english" ? (
            <div className="warn-box" style={{ background: "var(--bg)", marginBottom: 12 }}>
              <b>80 marks - real CBSE (Communicative) board pattern</b>
              <div className="muted" style={{ marginTop: 4 }}>
                Reading Skills (22) + Writing Skills (22) + Grammar (10) + Literature Textbook (26).
              </div>
              <label className="field-label" style={{ marginTop: 10 }}>Paper</label>
              <select value={englishSet} onChange={(e) => setEnglishSet(e.target.value)}>
                <option value="">Random mix (new paper every time)</option>
                {englishSets.map((x) => <option key={x.id} value={x.id}>{x.title}</option>)}
              </select>
              {englishSet && (
                <div className="muted" style={{ marginTop: 4 }}>
                  {(englishSets.find((x) => x.id === englishSet) || {}).note}
                </div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <label className="field-label">Paper style</label>
              <label style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, cursor: "pointer" }}>
                <input type="radio" name="paperMode" checked={paperMode === "fixed"} onChange={() => setPaperMode("fixed")} />
                <span><b>Fixed board pattern</b> <span className="muted">(30 or 80 marks, CBSE typology mix)</span></span>
              </label>
              <label style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12, cursor: "pointer" }}>
                <input type="radio" name="paperMode" checked={paperMode === "custom"} onChange={() => setPaperMode("custom")} />
                <span><b>Custom</b> <span className="muted">(pick how many of each question type)</span></span>
              </label>

              {paperMode === "fixed" ? (
                <React.Fragment>
                  <label style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, cursor: "pointer" }}>
                    <input type="radio" name="totalMarks" checked={totalMarks === 30} onChange={() => setTotalMarks(30)} />
                    <span><b>30 marks</b> <span className="muted">(6 MCQ + 3 Assertion-Reason + 3 Case-based + 3&times;2M + 1&times;3M)</span></span>
                  </label>
                  <label style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 12, cursor: "pointer" }}>
                    <input type="radio" name="totalMarks" checked={totalMarks === 80} onChange={() => setTotalMarks(80)} />
                    <span><b>80 marks</b> <span className="muted">(16 MCQ + 8 Assertion-Reason + 8 Case-based + 4&times;2M + 2&times;3M + 2&times;5M)</span></span>
                  </label>
                </React.Fragment>
              ) : (
                <div style={{ marginBottom: 12 }}>
                  <p className="muted" style={{ marginTop: -4, marginBottom: 8, fontSize: 12.5 }}>
                    e.g. set "2-mark" to 10 to generate a paper of just 10 two-mark questions.
                  </p>
                  {CUSTOM_TYPE_INFO.map((t) => (
                    <label key={t.key} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 6 }}>
                      <span style={{ width: 140 }}>{t.label} <span className="muted">({t.marksEach}m each)</span></span>
                      <input
                        type="number" min="0" max="50" style={{ width: 70 }}
                        value={customCounts[t.key]}
                        onChange={(e) => setCustomCount(t.key, e.target.value)}
                      />
                    </label>
                  ))}
                  <p className="muted" style={{ marginTop: 8 }}>
                    {customTotalQuestions} question{customTotalQuestions === 1 ? "" : "s"}, {customTotalMarks} marks total.
                  </p>
                </div>
              )}
            </React.Fragment>
          )}

          <label className="field-label">Number of practice sets</label>
          <input type="number" min="1" max="3" value={numSets} onChange={(e) => setNumSets(e.target.value)} />
          <p className="muted" style={{ marginTop: 6 }}>
            Generates that many distinct versions (Set A, Set B, ...) with different questions where the
            question bank allows, so you can re-practice the same chapters without repeats. A larger paper
            draws on a lot of questions, so select several chapters to avoid running short.
          </p>

          <button className="btn orange" style={{ marginTop: 10 }} disabled={loading} onClick={generate}>
            {loading ? "Generating..." : "Generate Question Paper(s)"}
          </button>
        </div>
      </div>
    </div>
  );
}

function TypologyBadge({ typology, compact }) {
  if (!typology) return null;
  const t = typology.target || { competency_pct: 50, mcq_pct: 20, descriptive_pct: 30 };
  const rows = [
    { label: "Competency-based", pct: typology.competency_pct, marks: typology.competency_marks, target: t.competency_pct },
    { label: "MCQ", pct: typology.mcq_pct, marks: typology.mcq_marks, target: t.mcq_pct },
    { label: "Descriptive", pct: typology.descriptive_pct, marks: typology.descriptive_marks, target: t.descriptive_pct },
  ];
  if (compact) {
    return (
      <div className="tag-list" style={{ marginTop: 4 }}>
        {rows.map((r) => (
          <span key={r.label} className="keyword-chip" style={{ background: Math.abs(r.pct - r.target) <= 3 ? "#eaf6ea" : "#fdf1e0", color: Math.abs(r.pct - r.target) <= 3 ? "#2f7a3d" : "#a15b0a" }}>
            {r.label}: {r.pct}%
          </span>
        ))}
      </div>
    );
  }
  return (
    <div className="notes-section" style={{ marginBottom: 10 }}>
      <h3 style={{ fontSize: 14 }}>Typology check (CBSE mandate: 50% competency-based / 20% MCQ / 30% descriptive)</h3>
      <div className="tag-list">
        {rows.map((r) => {
          const onTarget = Math.abs(r.pct - r.target) <= 3;
          return (
            <span key={r.label} className="keyword-chip" style={{ fontSize: 12.5, background: onTarget ? "#eaf6ea" : "#fdf1e0", color: onTarget ? "#2f7a3d" : "#a15b0a" }}>
              {r.label}: {r.marks} marks ({r.pct}%, target {r.target}%)
            </span>
          );
        })}
      </div>
    </div>
  );
}

        <button className="btn secondary" onClick={onBack}>Change chapters</button>

// Shows the correct answer / model answer / rubric for every question on a
// paper, un-stripped - meant for a parent or teacher marking a physical
// handwritten answer sheet by hand, as an alternative to the OCR auto-fill
// path (which needs Tesseract installed and still struggles with real
// handwriting). Fetches fresh from /api/papers/{id}/answer-key rather than
// reusing whatever `paper` object the caller already has in state, since
// that object is very often the stripped, student-facing version returned by
// /generate or /submit (no answer_index/rubric/model_answer on it at all).
function AnswerKeyView({ paperId, onBack }) {
  const [paper, setPaper] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => {
    setPaper(null);
    setError("");
    apiGet(`/api/papers/${paperId}/answer-key`)
      .then(setPaper)
      .catch((e) => setError(e.message));
  }, [paperId]);

  if (error) {
    return (
      <div className="card">
        <div className="error-box">{error}</div>
        <button className="btn secondary" style={{ marginTop: 10 }} onClick={onBack}>Back</button>
      </div>
    );
  }
  if (!paper) {
    return <div className="card">Loading answer key...</div>;
  }

  const grouped = annotateGrouping(paper.questions, !!(paper.sections && paper.sections.length > 0));

  return (
    <div>
      <div className="card no-print">
        <div className="result-row" style={{ marginBottom: 10 }}>
          <h2 style={{ margin: 0 }}>Answer key - {paper.set_label ? paper.set_label + " - " : ""}{paper.total_marks} marks</h2>
          <div>
            <button className="btn secondary" onClick={onBack}>Back</button>{" "}
            <button className="btn" onClick={() => window.print()}>Print</button>
          </div>
        </div>
        <p className="muted" style={{ marginTop: 0 }}>
          Correct options, model answers and mark-scheme points for every question - use this to mark
          a handwritten answer sheet by hand instead of relying on the OCR upload.
        </p>
      </div>

      <div className="card">
        {grouped.map((q, idx) => (
          <React.Fragment key={q.id}>
            {q._startsSection && <div className="section-header">{q._sectionLabel}</div>}
            {(["CBQ", "MAP", "READING", "EXTRACT", "CLOZE", "EDITING", "REPORTED"].includes(q.group_type || q.type)) && q._startsGroup && <PassageBox text={q.passage} />}
            <div className="question-block" style={{ borderTop: q._startsSection ? "none" : undefined }}>
              <div className="question-head">
                <span className={pillClass(q.group_type || q.type)}>{pillLabel(q)}</span>
                <span className="marks">
                  Q{idx + 1}{q.part_label ? " (" + q.part_label + ")" : ""} &middot; {q.chapter_title} &middot; {q.marks} mark{q.marks === 1 ? "" : "s"}
                </span>
              </div>
              <div className="question-text">{q.question}</div>

              {isChoiceType(q.type) ? (
                <div className="options">
                  {(q.options || []).map((opt, oi) => (
                    <div key={oi} style={oi === q.answer_index ? { fontWeight: 700, color: "var(--navy)" } : undefined}>
                      {oi === q.answer_index ? "✓ " : "   "} {opt}
                    </div>
                  ))}
                  {q.explanation && (
                    <div className="muted" style={{ fontSize: 12.5, marginTop: 6 }}>{q.explanation}</div>
                  )}
                </div>
              ) : (
                <div>
                  {q.model_answer && (
                    <div style={{ marginTop: 4 }}>
                      <b style={{ fontSize: 12.5 }}>Model answer:</b>
                      <div style={{ marginTop: 2 }}>{q.model_answer}</div>
                    </div>
                  )}
                  {q.rubric && q.rubric.length > 0 && (
                    <div style={{ marginTop: 8 }}>
                      <b style={{ fontSize: 12.5 }}>Key points expected ({q.marks} mark{q.marks === 1 ? "" : "s"} total):</b>
                      <ul style={{ marginTop: 4, marginBottom: 0 }}>
                        {q.rubric.map((p, pi) => (
                          <li key={pi} style={{ fontSize: 13.5 }}>{p.point}{p.weight ? ` (${p.weight} mark${p.weight === 1 ? "" : "s"})` : ""}</li>
                        ))}
                      </ul>
                    </div>
                  )}
                  {!q.model_answer && (!q.rubric || q.rubric.length === 0) && (
                    <div className="muted" style={{ fontSize: 12.5 }}>No model answer recorded for this question type - use your own judgement.</div>
                  )}
                </div>
              )}
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

const PATTERN_LABELS = { board: "Fixed board pattern", custom: "Custom", school: "School pattern", english: "English board pattern" };

// ---------------------------------------------------------------------------
// Lists every paper this browser has generated (device-local, via
// localStorage - see getRecentPapers/addRecentPapers above), so a paper is
// never truly "lost" just because the student navigated away or clicked
// "Change chapters". Each paper was already saved server-side the moment it
// was generated (see db.save_paper in server.py) - this view just fetches it
// back by id via GET /api/papers/{id} and drops the student straight into
// the attempt screen, same as picking a freshly-generated set.
function MyPapersView({ onOpen, onViewAnswerKey }) {
  const [papers, setPapers] = useState(() => getRecentPapers());
  const [openingId, setOpeningId] = useState(null);
  const [error, setError] = useState("");

  const open = (id) => {
    setOpeningId(id);
    setError("");
    apiGet("/api/papers/" + id)
      .then((paper) => onOpen(paper))
      .catch((e) => setError("Couldn't reopen this paper (it may have been generated on a different device or server): " + e.message))
      .finally(() => setOpeningId(null));
  };

  const remove = (id) => setPapers(removeRecentPaper(id));

  const clearAll = () => {
    clearRecentPapers();
    setPapers([]);
  };

  return (
    <div className="card">
      <div className="result-row" style={{ marginBottom: 10 }}>
        <h2 style={{ margin: 0 }}>My Papers</h2>
        {papers.length > 0 && <button className="btn secondary" onClick={clearAll}>Clear list</button>}
      </div>
      <p className="muted">
        Every paper you've generated on this device, whether or not you've attempted it yet. Papers stay
        available here even after you change chapters or close the app - this list just points back to them.
      </p>
      {error && <div className="error-box">{error}</div>}
      {papers.length === 0 ? (
        <div className="warn-box">
          No papers generated yet on this device. Generate one from the Question Paper tab and it'll show up here.
        </div>
      ) : (
        <div className="set-picker-grid">
          {papers.map((p) => (
            <div className="set-card" key={p.id}>
              <h3>{p.title}</h3>
              <div className="set-meta">
                {p.set_label ? p.set_label + " · " : ""}{p.total_marks} marks &middot; {PATTERN_LABELS[p.pattern] || p.pattern}
              </div>
              <div className="muted" style={{ fontSize: 11.5, marginBottom: 8 }}>
                Generated {new Date(p.generated_at).toLocaleString()}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn" disabled={openingId === p.id} onClick={() => open(p.id)}>
                  {openingId === p.id ? "Opening..." : "Open"}
                </button>
                <button className="btn secondary" onClick={() => onViewAnswerKey(p.id)}>Answer key</button>
                <button className="btn secondary" onClick={() => remove(p.id)}>Remove</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Skill practice: transposition method drill. Score per level (persisted in
// localStorage) so a student can see themselves improving over multiple
// visits, matching the pattern used for recent-papers tracking above.
const TRANSPOSE_SCORES_KEY = "cbse_transpose_scores";

function getTransposeScores() {
  try {
    const raw = localStorage.getItem(TRANSPOSE_SCORES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function pickRandomProblem(problems, excludeId) {
  const pool = problems.length > 1 ? problems.filter((p) => p.id !== excludeId) : problems;
  return pool[Math.floor(Math.random() * pool.length)];
}

function TransposePracticeView() {
  const [skill, setSkill] = useState(null);
  const [error, setError] = useState("");
  const [level, setLevel] = useState(1);
  const [problem, setProblem] = useState(null);
  const [userAnswer, setUserAnswer] = useState("");
  const [feedback, setFeedback] = useState(null); // null | "correct" | "incorrect"
  const [showSolution, setShowSolution] = useState(false);
  const [scores, setScores] = useState(() => getTransposeScores());

  useEffect(() => {
    apiGet("/api/skills/transposition").then(setSkill).catch((e) => setError(e.message));
  }, []);

  const currentLevelData = skill ? skill.levels.find((l) => l.level === level) : null;

  useEffect(() => {
    if (currentLevelData) {
      setProblem(pickRandomProblem(currentLevelData.problems));
      setUserAnswer("");
      setFeedback(null);
      setShowSolution(false);
    }
  }, [skill, level]);

  const recordResult = (isCorrect) => {
    setScores((prev) => {
      const cur = prev[level] || { correct: 0, attempted: 0 };
      const next = {
        ...prev,
        [level]: { correct: cur.correct + (isCorrect ? 1 : 0), attempted: cur.attempted + 1 },
      };
      localStorage.setItem(TRANSPOSE_SCORES_KEY, JSON.stringify(next));
      return next;
    });
  };

  const check = () => {
    if (userAnswer.trim() === "" || !problem) return;
    const given = parseFloat(userAnswer.trim());
    const expected = parseFloat(problem.answer);
    const isCorrect = !isNaN(given) && Math.abs(given - expected) < 1e-6;
    setFeedback(isCorrect ? "correct" : "incorrect");
    recordResult(isCorrect);
  };

  const next = () => {
    if (!currentLevelData) return;
    setProblem(pickRandomProblem(currentLevelData.problems, problem ? problem.id : null));
    setUserAnswer("");
    setFeedback(null);
    setShowSolution(false);
  };

  const resetScores = () => {
    localStorage.removeItem(TRANSPOSE_SCORES_KEY);
    setScores({});
  };

  if (error) return <div className="card"><div className="error-box">{error}</div></div>;
  if (!skill || !problem) return <div className="card">Loading practice problems...</div>;

  const levelScore = scores[level] || { correct: 0, attempted: 0 };

  return (
    <div className="card">
      <div className="result-row" style={{ marginBottom: 6 }}>
        <h2 style={{ margin: 0 }}>{skill.title}</h2>
        <button className="btn secondary" onClick={resetScores}>Reset scores</button>
      </div>
      <p className="muted">{skill.intro}</p>

      <div className="warn-box" style={{ background: "var(--bg)", marginBottom: 14 }}>
        <b>The transposition rule</b>
        <ul style={{ margin: "6px 0 0 18px", padding: 0 }}>
          {skill.rule_box.map((r, i) => <li key={i} style={{ marginBottom: 2 }}>{r}</li>)}
        </ul>
      </div>

      <label className="field-label">Level</label>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        {skill.levels.map((l) => (
          <button
            key={l.level}
            className={"btn" + (level === l.level ? "" : " secondary")}
            style={{ fontSize: 13 }}
            onClick={() => setLevel(l.level)}
          >
            {l.label}
            {scores[l.level] ? ` (${scores[l.level].correct}/${scores[l.level].attempted})` : ""}
          </button>
        ))}
      </div>
      <p className="muted" style={{ marginTop: -8, marginBottom: 14 }}>{currentLevelData.description}</p>

      <div style={{ textAlign: "center", padding: "20px 10px", background: "var(--bg)", borderRadius: 8, marginBottom: 14 }}>
        <div style={{ fontSize: 26, fontWeight: 600, letterSpacing: 0.5 }}>{problem.equation}</div>
      </div>

      <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
        <span>x =</span>
        <input
          type="text" inputMode="decimal" style={{ width: 100 }}
          value={userAnswer}
          onChange={(e) => { setUserAnswer(e.target.value); setFeedback(null); }}
          onKeyDown={(e) => { if (e.key === "Enter") check(); }}
          placeholder="answer"
        />
        <button className="btn orange" onClick={check}>Check</button>
        <button className="btn secondary" onClick={next}>Next problem</button>
      </div>

      {feedback === "correct" && <div className="warn-box" style={{ background: "#eaf6ea", color: "#2f7a3d" }}>Correct! x = {problem.answer}.</div>}
      {feedback === "incorrect" && <div className="warn-box" style={{ background: "#fdf1e0", color: "#a15b0a" }}>Not quite - try again, or show the solution below.</div>}

      <button className="btn secondary" style={{ marginTop: 10 }} onClick={() => setShowSolution((s) => !s)}>
        {showSolution ? "Hide solution" : "Show solution"}
      </button>
      {showSolution && (
        <div className="notes-section" style={{ marginTop: 10 }}>
          <ol style={{ margin: 0, paddingLeft: 20 }}>
            {problem.steps.map((s, i) => <li key={i} style={{ marginBottom: 4 }}>{s}</li>)}
          </ol>
        </div>
      )}

      <p className="muted" style={{ marginTop: 16 }}>
        This level: {levelScore.correct} correct out of {levelScore.attempted} attempted.
      </p>
    </div>
  );
}

function GeneralInstructions({ pattern, sections }) {
  if (pattern === "english") {
    return (
      <div className="card">
        <h3 style={{ marginTop: 0 }}>General Instructions</h3>
        <ul className="instructions-list">
          <li>This paper has four fixed sections: {sections.join(", ")}. All questions are compulsory - answer them in the order given.</li>
          <li><b>Section A - Reading Skills (22 marks):</b> two unseen passages (12 + 10 marks) with a mix of MCQs, complete-the-sentence, rectify-the-statement and short-answer questions. Read each passage carefully - some questions ask you to infer or synthesise rather than just locate a fact.</li>
          <li><b>Section B - Writing Skills (22 marks):</b> an application or email (&le;50 words, 3 marks - recent papers use either format for this question, so both appear here), a factual description (&le;100 words, 4 marks), a letter to the editor (~120 words, 7 marks) and an article/speech/story (~150 words, 8 marks). Stick to the word limit and use the correct format - format carries dedicated marks.</li>
          <li><b>Section C - Grammar (10 marks):</b> a gap-fill passage with bracketed options (3 marks), an editing/word-omission exercise (4 marks), a jumbled-sentence question (1 mark) and a reported-speech completion (2 marks).</li>
          <li><b>Section D - Literature Textbook (26 marks):</b> two extract-based passages (4 marks each, 4 sub-questions), five 2-mark short-answer questions in 30-40 words each, and one 8-mark comparative essay (~150 words) analysing two texts together.</li>
        </ul>
      </div>
    );
  }
  if (pattern !== "school") return null;
  return (
    <div className="card">
      <h3 style={{ marginTop: 0 }}>General Instructions</h3>
      <ul className="instructions-list">
        <li>This paper has sections for each subject you selected: {sections.join(", ")}.</li>
        <li>MCQ and Assertion-Reason (AR) questions carry 1 mark each.</li>
        <li>Very Short Answer (2M) questions carry 2 marks each - keep answers to about 40 words.</li>
        <li>Short Answer (3M) questions carry 3 marks each - keep answers to about 60 words.</li>
        <li>Long Answer (4M) questions carry 4 marks each - keep answers to about 120 words.</li>
        <li>Case-based (CBQ) questions have a short passage followed by sub-questions worth 1 mark each.</li>
        <li>Map-based (MAP) questions ask you to name a region/state (a text-based stand-in for labelling an actual map, which this app doesn't render).</li>
      </ul>
    </div>
  );
}

function PassageBox({ text }) {
  if (!text) return null;
  return (
    <div className="passage-box">
      <span className="passage-label">Read the passage and answer:</span>
      {text}
    </div>
  );
}

function AttemptPaperView({ paper, onSubmitted, onBack, backLabel, onViewAnswerKey }) {
  const [studentName, setStudentName] = useState(localStorage.getItem("cbse_student_name") || "");
  const [answers, setAnswers] = useState({});
  const [error, setError] = useState("");
  const [submitting, setSubmitting] = useState(false);

  const [sheetFiles, setSheetFiles] = useState([]);
  const [parsingSheet, setParsingSheet] = useState(false);
  const [sheetError, setSheetError] = useState("");
  const [sheetInfo, setSheetInfo] = useState(null);
  const [ocrStatus, setOcrStatus] = useState(null); // null = still checking; {available, reason} once known

  useEffect(() => {
    apiGet("/api/ocr-status")
      .then(setOcrStatus)
      .catch(() => setOcrStatus({ available: true, reason: null })); // fail open: don't block the feature if the status check itself errors
  }, []);

  const grouped = annotateGrouping(paper.questions, !!(paper.sections && paper.sections.length > 0));
  const writtenQuestionCount = paper.questions.filter((q) => !isChoiceType(q.type)).length;

  const setAnswer = (qid, patch) => {
    setAnswers((prev) => ({ ...prev, [qid]: { ...(prev[qid] || {}), ...patch } }));
  };

  const handleImage = async (qid, file) => {
    if (!file) return;
    const dataUrl = await fileToBase64(file);
    const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
    setAnswer(qid, {
      image_base64: dataUrl,
      image_preview: isPdf ? null : dataUrl,
      upload_name: file.name,
      upload_is_pdf: isPdf,
    });
  };

  const parseSheet = async () => {
    if (sheetFiles.length === 0) {
      setSheetError("Choose one or more photos (or a scanned PDF) of your answer sheet first.");
      return;
    }
    setParsingSheet(true);
    setSheetError("");
    setSheetInfo(null);
    try {
      const pages = await Promise.all(
        sheetFiles.map(async (f) => ({ data: await fileToBase64(f), name: f.name }))
      );
      const result = await apiPost(`/api/papers/${paper.id}/parse-sheet`, { pages });
      if (result.fatal_error) {
        setSheetError(result.fatal_error);
        return;
      }
      setAnswers((prev) => {
        const next = { ...prev };
        Object.entries(result.segments).forEach(([qid, text]) => {
          next[qid] = { ...(next[qid] || {}), answer_text: text, from_sheet: true };
        });
        return next;
      });
      setSheetInfo({
        matchedCount: result.matched_ids.length,
        unmatchedIds: result.unmatched_ids,
        unrecognisedMarkers: result.unrecognised_markers,
        pageErrors: result.page_errors,
      });
    } catch (e) {
      setSheetError(e.message);
    } finally {
      setParsingSheet(false);
    }
  };

  const submit = () => {
    if (!studentName.trim()) {
      setError("Please enter your name before submitting.");
      return;
    }
    localStorage.setItem("cbse_student_name", studentName.trim());
    setSubmitting(true);
    setError("");
    const payload = {
      student_name: studentName.trim(),
      answers: paper.questions.map((q) => {
        const a = answers[q.id] || {};
        return {
          question_id: q.id,
          selected_option: a.selected_option ?? null,
          answer_text: a.answer_text || "",
          image_base64: a.image_base64 || null,
        };
      }),
    };
    apiPost(`/api/papers/${paper.id}/submit`, payload)
      .then((result) => onSubmitted({ ...result, sections: paper.sections }))
      .catch((e) => setError(e.message))
      .finally(() => setSubmitting(false));
  };

  return (
    <div>
      <GeneralInstructions pattern={paper.pattern} sections={paper.sections || []} />

      <div className="card">
        <div className="result-row" style={{ marginBottom: 10 }}>
          <h2 style={{ margin: 0 }}>{paper.set_label ? paper.set_label + " - " : ""}{paper.total_marks} marks</h2>
          <div>
            <button className="btn secondary" onClick={onBack}>{backLabel || "Back to sets"}</button>{" "}
            {onViewAnswerKey && <button className="btn secondary" onClick={() => onViewAnswerKey(paper.id)}>Answer key</button>}
          </div>
        </div>
        <TypologyBadge typology={paper.typology} />
        {paper.warnings && paper.warnings.length > 0 && (
          <div className="warn-box">
            {paper.warnings.map((w, i) => <div key={i}>{w}</div>)}
          </div>
        )}
        {error && <div className="error-box">{error}</div>}

        <label className="field-label">Your name</label>
        <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="Enter your name" />

        {writtenQuestionCount > 0 && ocrStatus && !ocrStatus.available && (
          <div className="warn-box" style={{ background: "var(--bg)", marginTop: 14 }}>
            <b>Whole-sheet upload isn't set up on this server yet</b>
            <div className="muted" style={{ marginTop: 4, fontSize: 13 }}>
              Reading a photographed answer sheet needs an OCR engine (Tesseract) installed on
              the computer running this server - it isn't installed here yet
              ({ocrStatus.reason}), so uploads would fail after you've already gone to the
              trouble of taking photos. Ask whoever runs this server to run:
              <code style={{ display: "block", margin: "6px 0", padding: "6px 8px", background: "var(--card)", borderRadius: 4 }}>
                pip install pytesseract pillow{ocrStatus.reason && ocrStatus.reason.includes("Tesseract binary") ? "" : ""}
              </code>
              plus install the Tesseract binary itself (e.g. <code>brew install tesseract</code> on
              a Mac, <code>sudo apt install tesseract-ocr</code> on Linux, or the installer at{" "}
              <a href="https://github.com/UB-Mannheim/tesseract/wiki" target="_blank" rel="noreferrer">github.com/UB-Mannheim/tesseract/wiki</a> on
              Windows), then restart the server. Until then, please type your answers or upload
              one photo per question in the boxes below instead.
            </div>
          </div>
        )}

        {writtenQuestionCount > 0 && ocrStatus && ocrStatus.available && (
          <div className="warn-box" style={{ background: "var(--bg)", marginTop: 14 }}>
            <b>Prefer to write your answers on paper?</b>
            <div className="muted" style={{ marginTop: 4, marginBottom: 8, fontSize: 13 }}>
              Write your answers by hand as you would in the real exam - number each answer
              to match the question numbers below (e.g. "5." or "Q5") - then photograph or
              scan the pages and upload them here. We'll read your handwriting and fill in
              the matching answer boxes below automatically, so you only need to review and
              fix anything it got wrong before submitting. (MCQ / Assertion-Reason questions
              still need to be selected below, since those aren't written out by hand.)
            </div>
            <input
              type="file"
              accept="image/*,application/pdf,.pdf"
              multiple
              onChange={(e) => { setSheetFiles(Array.from(e.target.files || [])); setSheetInfo(null); setSheetError(""); }}
            />
            {sheetFiles.length > 0 && (
              <div className="muted" style={{ fontSize: 12.5, marginTop: 6 }}>
                {sheetFiles.length} file{sheetFiles.length === 1 ? "" : "s"} selected: {sheetFiles.map((f) => f.name).join(", ")}
              </div>
            )}
            <button className="btn secondary" style={{ marginTop: 8 }} disabled={parsingSheet} onClick={parseSheet}>
              {parsingSheet ? "Reading your handwriting..." : "Read my answer sheet"}
            </button>
            {sheetError && <div className="error-box" style={{ marginTop: 8 }}>{sheetError}</div>}
            {sheetInfo && (
              <div className="muted" style={{ fontSize: 13, marginTop: 8 }}>
                Filled in {sheetInfo.matchedCount} of {writtenQuestionCount} answer{writtenQuestionCount === 1 ? "" : "s"} from your sheet - please check them below.
                {sheetInfo.unmatchedIds.length > 0 && (
                  <div style={{ marginTop: 4 }}>
                    Couldn't find {sheetInfo.unmatchedIds.length} question{sheetInfo.unmatchedIds.length === 1 ? "" : "s"} on the sheet
                    (check that each answer is numbered clearly) - type or upload those manually below.
                  </div>
                )}
                {sheetInfo.pageErrors.length > 0 && (
                  <div style={{ marginTop: 4 }}>
                    Some pages couldn't be read: {sheetInfo.pageErrors.map((e, i) => <span key={i}>{e.source_name}{e.page_number > 1 ? ` (page ${e.page_number})` : ""}: {e.error} </span>)}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        <div style={{ marginTop: 18 }}>
          {grouped.map((q, idx) => (
            <React.Fragment key={q.id}>
              {q._startsSection && (
                <div className="section-header">{q._sectionLabel}</div>
              )}
              {(["CBQ", "MAP", "READING", "EXTRACT", "CLOZE", "EDITING", "REPORTED"].includes(q.group_type || q.type)) && q._startsGroup && <PassageBox text={q.passage} />}
              <div className="question-block" style={{ borderTop: q._startsSection ? "none" : undefined }}>
                <div className="question-head">
                  <span className={pillClass(q.group_type || q.type)}>{pillLabel(q)}</span>
                  <span className="marks">
                    Q{idx + 1}{q.part_label ? " (" + q.part_label + ")" : ""} &middot; {q.chapter_title}
                    {wordLimitHint(q.group_type || q.type) ? " · " + wordLimitHint(q.group_type || q.type) : ""}
                  </span>
                </div>
                <div className="question-text">{q.question}</div>
                {q.cues && q.cues.length > 0 && (
                  <div className="muted" style={{ fontSize: 12.5, marginTop: -4, marginBottom: 8 }}>
                    Use these cues, along with your own ideas: {q.cues.join(" · ")}
                  </div>
                )}

                {isChoiceType(q.type) ? (
                  <div className="options">
                    {q.options.map((opt, oi) => (
                      <label key={oi}>
                        <input
                          type="radio"
                          name={q.id}
                          checked={(answers[q.id] || {}).selected_option === oi}
                          onChange={() => setAnswer(q.id, { selected_option: oi })}
                        />
                        {opt}
                      </label>
                    ))}
                  </div>
                ) : (
                  <div>
                    {(answers[q.id] || {}).from_sheet && (
                      <div className="muted" style={{ fontSize: 12, marginBottom: 4 }}>
                        📄 Auto-filled from your uploaded answer sheet - check it's correct before submitting.
                      </div>
                    )}
                    <textarea
                      placeholder="Type your answer here..."
                      value={(answers[q.id] || {}).answer_text || ""}
                      onChange={(e) => setAnswer(q.id, { answer_text: e.target.value, from_sheet: false })}
                    />
                    <div className="image-upload-row">
                      <label className="muted" style={{ fontSize: 13 }}>
                        Or upload a photo/scan (or PDF) of your handwritten answer:
                      </label>
                      <input
                        type="file"
                        accept="image/*,application/pdf,.pdf"
                        onChange={(e) => handleImage(q.id, e.target.files[0])}
                      />
                      {(answers[q.id] || {}).image_preview && (
                        <img className="image-preview" src={(answers[q.id] || {}).image_preview} />
                      )}
                      {(answers[q.id] || {}).upload_is_pdf && (
                        <div className="muted" style={{ fontSize: 13, marginTop: 4 }}>
                          PDF selected: {(answers[q.id] || {}).upload_name}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            </React.Fragment>
          ))}
        </div>

        <button className="btn orange" style={{ marginTop: 16 }} disabled={submitting} onClick={submit}>
          {submitting ? "Grading..." : "Submit Answers for Grading"}
        </button>
      </div>
    </div>
  );
}

function scoreBadgeClass(awarded, available) {
  if (available === 0) return "zero";
  const ratio = awarded / available;
  if (ratio >= 0.85) return "full";
  if (ratio > 0) return "partial";
  return "zero";
}

  return (
    <div>
      <div className="card">
        <h2>Result for {result.student_name}</h2>

            {result.total_score} / {result.total_marks}

      <div className="card">
        <h2>Question-wise breakdown</h2>

            <div className="question-block">

              </div>
              <div className={"student-answer-box" + (!r.student_answer ? " empty" : "")}>

                </div>
              )}
              {r.missed_points && r.missed_points.length > 0 && (
                <div className="feedback-box missed">
                  <b>What to add / review:</b>
                  <ul>{r.missed_points.map((p, i) => <li key={i}>{p}</li>)}</ul>
                </div>
              )}
              {r.model_answer && (
                <div className="feedback-box">
                  <b>Model answer:</b> {r.model_answer}
                </div>
              )}
              {r.ocr_note && (
                <div className="warn-box" style={{ marginTop: 8 }}>
                  <b>Upload not read:</b> {r.ocr_note}
                </div>
              )}
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function PerfBar({ label, pct }) {
  const color = pct >= 75 ? "var(--green)" : pct >= 50 ? "var(--orange)" : "var(--red)";
  return (
    <div className="stat-row">
      <div className="label">{label}</div>
      <div className="progress-bar-track">
        <div className="progress-bar-fill" style={{ width: pct + "%", background: color }} />
      </div>
      <div className="pct">{pct}%</div>
    </div>
  );
}

function PerformanceView({ defaultStudent, onViewSubmission }) {
  const [studentName, setStudentName] = useState(defaultStudent || localStorage.getItem("cbse_student_name") || "");
  const [report, setReport] = useState(null);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [openingId, setOpeningId] = useState(null);

  const openSubmission = (subId, paperId) => {
    setOpeningId(subId);
    Promise.all([
      apiGet("/api/submissions/" + subId),
      apiGet("/api/papers/" + paperId).catch(() => null), // best-effort, only used for section headers
    ])
      .then(([sub, paper]) => {
        onViewSubmission({
          submission_id: sub.id,
          student_name: sub.student_name,
          total_score: sub.total_score,
          total_marks: sub.total_marks,
          percentage: sub.total_marks ? Math.round((sub.total_score / sub.total_marks) * 1000) / 10 : 0,
          results: sub.results,
          sections: paper ? paper.sections : [],
        });
      })
      .catch((e) => setError(e.message))
      .finally(() => setOpeningId(null));
  };

  const load = () => {
    if (!studentName.trim()) {
      setError("Enter a student name to view performance.");
      return;
    }
    setLoading(true);
    setError("");
    apiGet("/api/performance?student=" + encodeURIComponent(studentName.trim()))
      .then((d) => setReport(d))
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    if (defaultStudent) load();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [defaultStudent]);

  return (
    <div>
      <div className="card">
        <h2>Performance Analysis</h2>
        <div className="grid-2">
          <div>
            <label className="field-label">Student name</label>
            <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="Enter your name" />
          </div>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <button className="btn" onClick={load} disabled={loading}>
              {loading ? "Loading..." : "View my performance"}
            </button>
          </div>
        </div>
        {error && <div className="error-box" style={{ marginTop: 12 }}>{error}</div>}
      </div>

      {report && report.attempts === 0 && (
        <div className="card"><p className="muted">{report.message}</p></div>
      )}

      {report && report.attempts > 0 && (
        <React.Fragment>
          <div className="card">
            <h2>Overall</h2>
            <div style={{ fontSize: 26, fontWeight: 700, color: "var(--navy)" }}>{report.overall_percentage}%</div>
            <p className="muted">
              Based on {report.attempts} attempt{report.attempts > 1 ? "s" : ""} &middot;{" "}
              {report.total_awarded} / {report.total_available} marks scored across all papers.
            </p>

            <h3 style={{ marginTop: 16 }}>By question type</h3>
            {Object.entries(report.question_type_performance).map(([type, pct]) => (
              <PerfBar key={type} label={type} pct={pct} />
            ))}
          </div>

          <div className="card">
            <h3>By chapter</h3>
            {Object.entries(report.chapter_performance).map(([ch, pct]) => (
              <PerfBar key={ch} label={ch} pct={pct} />
            ))}
          </div>

          <div className="card">
            <h3>By topic</h3>
            {Object.entries(report.topic_performance).map(([topic, pct]) => (
              <PerfBar key={topic} label={topic} pct={pct} />
            ))}
          </div>

          <div className="card">
            <h3>Strengths &amp; areas to improve</h3>
            <div className="tag-list">
              {report.strengths.map((s) => <span key={s} className="tag good">{s}</span>)}
              {report.needs_practice.map((s) => <span key={s} className="tag mid">{s}</span>)}
              {report.weaknesses.map((s) => <span key={s} className="tag bad">{s}</span>)}
            </div>
            <h3 style={{ marginTop: 16 }}>Recommendations</h3>
            <ul>
              {report.recommendations.map((r, i) => <li key={i} style={{ marginBottom: 6, fontSize: 14 }}>{r}</li>)}
            </ul>
          </div>

          <div className="card">
            <h3>Attempt history</h3>
            <p className="muted" style={{ marginTop: -6, marginBottom: 10 }}>Click any past attempt to re-open its full question paper, your answers, and the per-question feedback.</p>
            {report.history.map((h) => (
              <div
                key={h.submission_id}
                className="stat-row"
                style={{ cursor: "pointer", opacity: openingId === h.submission_id ? 0.6 : 1 }}
                onClick={() => openSubmission(h.submission_id, h.paper_id)}
                title="View this paper again"
              >
                <div className="label">{new Date(h.submitted_at + "Z").toLocaleString()}</div>
                <div className="progress-bar-track">
                  <div className="progress-bar-fill" style={{ width: h.percentage + "%", background: "var(--blue)" }} />
                </div>
                <div className="pct">{h.score}/{h.total}</div>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
function App() {
  const [view, setView] = useState("notes");
  const [sets, setSets] = useState(null);
  const [paper, setPaper] = useState(null);
  const [result, setResult] = useState(null);
  const [course, setCourse] = useState(localStorage.getItem("cbse_course") || "social_science");
  const [jumpToChapter, setJumpToChapter] = useState("");
  const [answerKeyPaperId, setAnswerKeyPaperId] = useState(null);
  const [answerKeyReturnView, setAnswerKeyReturnView] = useState("papers");

  const viewAnswerKey = (paperId) => {
    setAnswerKeyReturnView(view);
    setAnswerKeyPaperId(paperId);
    setView("answerkey");
  };

  // Top-nav clicks must reset any in-progress paper/set state - otherwise
  // e.g. clicking "Question Paper" again after already generating one leaves
  // `sets` non-null while view resets to "generate", and the generator view
  // guard (which only renders when `!sets`) then renders nothing at all.
  const onNavigate = (key) => {
    if (key === "generate") {
      setSets(null);
      setPaper(null);
    }
    setView(key);
  };

  // Switching course mid-flow (e.g. while a paper/result from the other
  // course is on screen) resets in-progress state and returns to Notes, so
  // Science and Social Science content never mix in one paper/attempt.
  const onCourseChange = (key) => {
    if (key === course) return;
    localStorage.setItem("cbse_course", key);
    setCourse(key);
    setSets(null);
    setPaper(null);
    setResult(null);
    setView("notes");
  };

  return (
    <div className="app-shell">
      <TopNav view={view} onNavigate={onNavigate} course={course} onCourseChange={onCourseChange} />
      <div className="container">
        {view === "notes" && (
          <NotesView
            course={course}
            initialChapterId={jumpToChapter}
            onInitialChapterConsumed={() => setJumpToChapter("")}
          />
        )}

        {view === "ask" && (
          <AskTopicView
            onOpenChapter={(chapterId, group) => {
              if (group && group !== course) {
                localStorage.setItem("cbse_course", group);
                setCourse(group);
              }
              setJumpToChapter(chapterId);
              setView("notes");
            }}
          />
        )}

        {view === "askai" && <AskAIView />}

        {view === "generate" && !sets && (
          <GeneratePaperView
            course={course}
            onSetsReady={(newSets) => {
              addRecentPapers(newSets, course);
              setSets(newSets);
              if (newSets.length === 1) {
                setPaper(newSets[0]);
                setView("attempt");
              } else {
                setView("pickset");
              }
            }}
          />
        )}

        {view === "papers" && (
          <MyPapersView
            onOpen={(reopenedPaper) => {
              setSets(null);
              setPaper(reopenedPaper);
              setView("attempt");
            }}
            onViewAnswerKey={viewAnswerKey}
          />
        )}

        {view === "transpose" && course === "mathematics" && <TransposePracticeView />}

        {view === "pickset" && sets && (
          <SetPickerView
            sets={sets}
            onBack={() => {
              setSets(null);
              setView("generate");
            }}
            onAttempt={(p) => {
              setPaper(p);
              setView("attempt");
            }}
            onViewAnswerKey={viewAnswerKey}
          />
        )}

        {view === "answerkey" && answerKeyPaperId && (
          <AnswerKeyView
            paperId={answerKeyPaperId}
            onBack={() => {
              setAnswerKeyPaperId(null);
              setView(answerKeyReturnView);
            }}
          />
        )}

        {view === "attempt" && paper && (
          <AttemptPaperView
            paper={paper}
            backLabel={sets ? "Back to sets" : "Back to My Papers"}
            onViewAnswerKey={viewAnswerKey}
            onBack={() => {
              // Don't discard `sets`/`paper` here - the generated paper(s)
              // must stay reachable so "Back to sets" never loses the paper
              // the student was just looking at. Only the "Change chapters"
              // action inside SetPickerView actually clears state and returns
              // to the blank generator form.
              //
              // If this paper was instead reopened from "My Papers" (`sets`
              // is null - it wasn't part of a freshly-generated batch), there
              // is no set list to go back to, so return to "My Papers"
              // instead - going to "pickset" with sets=null would render a
              // blank page.
              setPaper(null);
              setView(sets ? "pickset" : "papers");
            }}
            onSubmitted={(r) => {
              setResult(r);
              setView("results");
            }}
          />
        )}

        {view === "results" && result && (
          <ResultsView
            result={result}
            onDone={() => {
              setPaper(null);
              setSets(null);
              setResult(null);
              setView("generate");
            }}
            onViewPerformance={() => setView("performance")}
          />
        )}

        {view === "performance" && (
          <PerformanceView
            defaultStudent={result ? result.student_name : null}
            onViewSubmission={(r) => {
              setResult(r);
              setView("results");
            }}
          />
        )}
      </div>
      <div className="footer-note">
        CBSE Class 10 Study &amp; Practice App &middot; Backend: {API_BASE}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
